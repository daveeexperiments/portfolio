<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The lab — Davee Experiments</title>
<meta name="description" content="Every experiment on the bench, filed by shelf. Games, itch.io, tools, AI experiments and engine plugins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
header.bench{display:grid;gap:14px}
header.bench h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.5vw,60px);line-height:.98;
  letter-spacing:-.03em;margin:0;text-wrap:balance}
header.bench .lede{max-width:60ch;margin:0;color:var(--muted);font-size:17px}
.bench-stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.bench-stats span b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

.rail{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;z-index:2;
  background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13.5px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:var(--accent-ink);opacity:.8}
.search{font:400 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;width:100%;max-width:340px}

.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-width:0;position:relative}
.label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px dashed var(--line);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--st)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st)}
.status.running::before{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.status.running::before{animation:none}}
.card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cat{font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:.04em}
.card h3{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14.5px}
.q{font-size:14px;border-left:2px solid var(--line);padding-left:10px;color:var(--ink)}
.q i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);display:block;letter-spacing:.06em;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:3px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:13px}
.foot a{color:var(--accent);font-weight:600;text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .none{color:var(--muted);font-family:var(--mono);font-size:12px}

.slot{border:1.5px dashed var(--line);border-radius:4px;padding:22px 18px;display:flex;flex-direction:column;gap:6px;justify-content:center;color:var(--muted);min-height:180px}
.slot strong{font-family:var(--display);font-size:20px;color:var(--ink)}
.slot code{font-family:var(--mono);font-size:12px}
</style>
</head>
<body>

<div class="wrap">

  <nav class="nav">
    <a class="mark" href="/"><span class="dot"></span> daveeexperiments.xyz</a>
    <ul>
      <li><a class="link" href="/">Index</a></li>
      <li><a class="link" href="/lab" aria-current="page">The lab</a></li>
      <li><a class="link" href="/about">About</a></li>
    </ul>
  </nav>

  <header class="bench">
    <h1>The lab</h1>
    <p class="lede">Everything on the bench, filed by shelf. Each card carries the question the experiment is testing.</p>
    <div class="bench-stats" id="stats"></div>
  </header>

  <div class="rail">
    <div class="chips" id="chips" role="toolbar" aria-label="Filter by category"></div>
    <input class="search" id="q" type="search" placeholder="Search experiments, tools, stacks" aria-label="Search">
  </div>

  <main class="rack" id="rack" aria-live="polite"></main>

  <footer>
    <span>David Olamide · Dimension11 Studios · Lisbon / Lagos</span>
    <span id="updated"></span>
  </footer>

</div>

<script src="/experiments.js"></script>
<script>
const $ = s => document.querySelector(s);
const STATUS_VAR = {running:"--s-running",paused:"--s-paused",shipped:"--s-shipped",archived:"--s-archived"};
let active = "all";
try{ const saved = localStorage.getItem("dx-filter"); if(saved && (saved==="all"||CATEGORIES[saved])) active = saved; }catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function renderStats(){
  const by = s => EXPERIMENTS.filter(e=>e.status===s).length;
  $("#stats").innerHTML =
    `<span><b>${EXPERIMENTS.length}</b> filed</span>
     <span><b>${by("running")}</b> running</span>
     <span><b>${by("shipped")}</b> shipped</span>
     <span><b>${Object.keys(CATEGORIES).length}</b> shelves</span>`;
}

function renderChips(){
  const all = [["all","Everything",EXPERIMENTS.length],
    ...Object.entries(CATEGORIES).map(([k,v])=>[k,v,EXPERIMENTS.filter(e=>e.category===k).length])];
  $("#chips").innerHTML = all.map(([k,v,n]) =>
    `<button class="chip" data-k="${k}" aria-pressed="${k===active}">${esc(v)} <span class="n">${n}</span></button>`).join("");
}

function card(e){
  const st = STATUS_VAR[e.status] || "--s-archived";
  return `<article class="card">
    <div class="label"><span>${esc(e.id)} · ${esc(e.date)}</span>
      <span class="status ${esc(e.status)}" style="--st:var(${st})">${esc(e.status)}</span></div>
    <div class="body">
      <span class="cat">${esc(CATEGORIES[e.category]||e.category)}</span>
      <h3>${esc(e.title)}</h3>
      <p>${esc(e.blurb)}</p>
      ${e.question?`<div class="q"><i>Testing</i>${esc(e.question)}</div>`:""}
      <div class="tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>
    <div class="foot">${e.link
      ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">Open experiment →</a>`
      : `<span class="none">No public build yet</span>`}</div>
  </article>`;
}

function slot(name){
  return `<div class="slot"><strong>${esc(name)} shelf is empty</strong>
    <span>Nothing filed here yet. Add an entry with <code>category</code> set to this shelf.</span></div>`;
}

function render(){
  const q = $("#q").value.trim().toLowerCase();
  let list = EXPERIMENTS.filter(e => active==="all" || e.category===active);
  if(q) list = list.filter(e => [e.title,e.blurb,e.question,CATEGORIES[e.category],...e.tags].join(" ").toLowerCase().includes(q));
  let html = list.map(card).join("");
  if(!q){
    const empties = Object.entries(CATEGORIES).filter(([k])=>(active==="all"||active===k) && !EXPERIMENTS.some(e=>e.category===k));
    html += empties.map(([,v])=>slot(v)).join("");
  }
  if(!html) html = `<div class="slot"><strong>No matches</strong><span>Try a different word or switch back to Everything.</span></div>`;
  $("#rack").innerHTML = html;
}

$("#chips").addEventListener("click", ev=>{
  const b = ev.target.closest(".chip"); if(!b) return;
  active = b.dataset.k;
  try{ localStorage.setItem("dx-filter", active); }catch(e){}
  renderChips(); render();
});
$("#q").addEventListener("input", render);

$("#updated").textContent = "Index updated Oct 2026";
renderStats(); renderChips(); render();
</script>

</body>
</html>
